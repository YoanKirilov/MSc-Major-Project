<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <title>{% block title %}NetGuard AI{% endblock %}</title>
    <script src="/static/js/appearance.js?v=20261015-inclusive"></script>
    <link rel="stylesheet" href="/static/css/app.css?v=20261015-inclusive" />
    {% block styles %}{% endblock %}
  </head>
  <body>
    <div class="page-shell">
      {% include "includes/shared-header.html" %}
      <main id="main-content" class="utility-main" tabindex="-1">
        {% block content %}{% endblock %}
      </main>
      {% include "includes/shared-footer.html" %}
    </div>
    {% block scripts %}{% endblock %}
  </body>
</html>
