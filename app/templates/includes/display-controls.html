<div class="display-preferences-grid">
  <div class="form-field">
    <label for="themePreference">Colour theme</label>
    <select id="themePreference" aria-describedby="{{ display_preferences_note }}"><option value="dark">Dark</option><option value="light">Light</option><option value="system">Use device theme</option></select>
  </div>
  <div class="form-field">
    <label for="textSizePreference">Text size</label>
    <select id="textSizePreference" aria-describedby="{{ display_preferences_note }}"><option value="standard">Standard</option><option value="larger">Larger</option></select>
  </div>
</div>
<p id="appearance-feedback" class="status-message" role="status" aria-atomic="true"></p>
