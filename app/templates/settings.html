{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Settings</h2>
  <form id="settings-form">
    <label for="allowed-network">Allowed CIDR</label>
    <input id="allowed-network" type="text" value="192.168.0.0/24" />
    <label for="interface-select">Interface</label>
    <select id="interface-select">
      <option value="eth0">eth0</option>
      <option value="ens33">ens33</option>
      <option value="lo">lo</option>
    </select>
    <label><input type="checkbox" id="retain-raw-xml" /> Retain raw XML</label>
    <label><input type="checkbox" id="ai-enabled" /> Enable AI explanations</label>
    <button type="submit">Save settings</button>
  </form>
</section>
{% endblock %}
{% block scripts %}
<script type="module" src="/static/js/settings.js"></script>
{% endblock %}
