name: Offline and browser checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
        browser: [chromium, firefox, webkit]
    runs-on: ${{ matrix.os }}
    # Windows Firefox took 20m30s for 141 passing cases, excluding setup/package
    # checks. Give that slower runner a measured budget; do not drop coverage.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 35 || 25 }}
    env:
      BROWSER_CHANNEL: ''
      PYTHONUNBUFFERED: '1'
      # Report the first failure before a long run can lose its traceback.
      # Every OS/Python/engine combination remains in the test matrix.
      PYTEST_ADDOPTS: '-x -vv'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Isolate Python dependencies from preinstalled runner tools
        shell: python
        run: |
          import os
          from pathlib import Path
          import venv
          environment = Path('.venv-ci').resolve()
          venv.EnvBuilder(with_pip=True).create(environment)
          scripts = environment / ('Scripts' if os.name == 'nt' else 'bin')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(str(scripts) + '\n')
      - name: Install pinned test environment
        run: python -m pip install -r requirements-dev.lock -e ".[dev]"
      - run: python -m pip check
      - name: Install synthetic-workflow browser
        # Some end-to-end fixtures still use Chromium in every engine job.
        # Install that and the selected engine, not unrelated third engines.
        run: python -m playwright install --with-deps chromium ${{ matrix.browser }}
      - name: Check code, offline tests and browser workflow (no network scans)
        run: python scripts/check.py --browser --browser-engines ${{ matrix.browser }}
      - name: Build and verify installed package
        run: python scripts/check_package.py

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Isolate security tooling from preinstalled runner tools
        shell: python
        run: |
          import os
          from pathlib import Path
          import venv
          environment = Path('.venv-ci').resolve()
          venv.EnvBuilder(with_pip=True).create(environment)
          scripts = environment / ('Scripts' if os.name == 'nt' else 'bin')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(str(scripts) + '\n')
      - run: python -m pip install -r requirements-security.lock
      - name: Dependency, static and offline secret gates
        run: python scripts/check_security.py
