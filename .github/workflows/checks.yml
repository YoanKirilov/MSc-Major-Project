name: Offline and browser checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      BROWSER_CHANNEL: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned test environment
        run: python -m pip install -r requirements-dev.lock -e ".[dev]"
      - run: python -m pip check
      - name: Install synthetic-workflow browser
        run: python -m playwright install --with-deps chromium
      - name: Check code, offline tests and browser workflow (no network scans)
        run: python scripts/check.py --browser
      - name: Build and verify installed package
        run: python scripts/check_package.py
