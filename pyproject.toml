[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-assessor"
version = "0.1.0"
description = "Local Network and IoT Security Assessment Tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.29,<1.0",
  "pydantic>=2.7,<3.0",
  "jinja2>=3.1,<4.0",
  "httpx>=0.27,<1.0",
  "filelock>=3.31,<4.0",
  "platformdirs>=4.0,<5.0",
  "defusedxml>=0.7,<1.0",
  "zeroconf>=0.149,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.5,<1.0",
  "build>=1.2,<2.0",
  "playwright>=1.46,<2.0",
]

[project.scripts]
network-assessor = "app.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/css/*.css", "static/js/*.js", "static/js/*.mjs", "demo/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test_*.py"]
markers = [
  "live_lab: live network lab checks",
  "live_provider: opt-in live AI provider checks",
  "human_study: research study checks",
  "browser: opt-in browser workflow with synthetic scan/provider responses",
]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
